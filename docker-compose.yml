# Local test only: app + MySQL on your machine.
#   docker compose up --build
# Then open http://localhost:8080
# The passwords below are local throwaway defaults; Nimbuz uses its own secrets.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sampledb
      MYSQL_USER: app
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-localdev}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-localroot}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "3306:3306"

  app:
    build: .
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-localdev}
      DB_NAME: sampledb
      DB_POOL_SIZE: 10
      SEED_ROWS: 5000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
